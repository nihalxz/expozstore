<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xzestore</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDKs (v8 compat for CDN React setup) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- App Styles -->
    <link rel="stylesheet" href="styles.css?v=2.22">

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- html2canvas for Receipt Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root">
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: 'Outfit', sans-serif; background: #faf5ff;">
            <div style="width: 40px; height: 40px; border: 3px solid #e2e8f0; border-top: 3px solid #9333ea; border-radius: 50%; animation: spin 1s linear infinite;"></div>
            <h2 style="margin-top: 20px; color: #9333ea; font-weight: 700; margin-bottom: 5px;">xzestore</h2>
            <p style="color: #6b7280; font-size: 0.9rem; margin: 0;">Loading amazing products...</p>
            <style>
                @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
                body { margin: 0; }
            </style>
        </div>
    </div>
    <div id="error-log" style="color: red; padding: 20px; font-family: monospace; white-space: pre-wrap; z-index: 9999; position: relative;"></div>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            document.getElementById('error-log').innerText += "Error: " + message + '\n';
        };
        window.addEventListener('unhandledrejection', function(event) {
            document.getElementById('error-log').innerText += "Promise Error: " + event.reason + '\n';
        });
    </script>

    <!-- Main React App -->
    <script type="text/babel" src="app.jsx?v=2.22"></script>
</body>
</html>
